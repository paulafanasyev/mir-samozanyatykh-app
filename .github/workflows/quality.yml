name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository structure
        run: |
          test -f README.md
          test -f .gitignore
          test -d .github/workflows
          python -m compileall -q backend 2>/dev/null || true
