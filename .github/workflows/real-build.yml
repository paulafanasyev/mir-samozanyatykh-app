name: Real builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: real-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio aiosqlite
      - name: Syntax check
        run: python -m compileall -q app
      - name: Tests
        run: pytest -q

  web:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
      - name: Attest web artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontend/dist/**

  android:
    name: Android release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --flavor prod
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
      - name: Attest APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: mobile/build/app/outputs/flutter-apk/app-prod-release.apk

  ios:
    name: iOS release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: Build iOS without signing
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Package iOS build
        working-directory: mobile
        run: tar -czf ../ios-release-${{ github.sha }}.tar.gz build/ios/iphoneos/Runner.app
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.sha }}
          path: ios-release-${{ github.sha }}.tar.gz
          if-no-files-found: error
